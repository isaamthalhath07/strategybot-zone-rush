<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zone Rush Harness</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="9" height="9" rx="2" class="b1"/><rect x="13" y="2" width="9" height="9" rx="2" class="b2"/><rect x="13" y="13" width="9" height="9" rx="2" class="b3"/><rect x="2" y="13" width="9" height="9" rx="2" class="b4"/></svg>
    <span>Zone Rush Harness</span>
  </div>
  <div class="repo" id="repo-info"></div>
  <div class="top-actions">
    <button id="toggle-setup" class="ghost" title="Show or hide the game setup">Setup</button>
    <div class="menu">
      <button id="replays-btn" class="ghost">Replays</button>
      <div id="replays-menu" class="menu-panel" hidden></div>
    </div>
    <label class="ghost button" title="Open a replay .json file">Open file<input id="open-file" type="file" accept=".json,application/json" hidden></label>
    <a id="download" class="ghost button" hidden>Download</a>
  </div>
</header>

<main id="layout">
  <aside id="setup" class="panel">
    <div class="panel-head">
      <h2>Seats</h2>
      <button id="fetch" class="ghost small" title="git fetch --all --prune">Fetch branches</button>
    </div>
    <div id="seats-setup"></div>
    <div class="row gap">
      <button id="copy-seat" class="ghost small">Seat 1 to all</button>
      <button id="rotate-seats" class="ghost small" title="Move every bot one seat on">Rotate seats</button>
    </div>

    <h2>Map</h2>
    <div class="seg" id="map-kind">
      <button data-kind="example" class="on">Rulebook</button>
      <button data-kind="random">Random</button>
      <button data-kind="custom">Custom</button>
    </div>
    <div id="map-random" class="field" hidden><label>Seed <input id="map-seed" type="number" value="1"></label></div>
    <div id="map-custom" class="field" hidden><label>Top-left quadrant <input id="map-quadrant" value="1112/1122/1223/2233" spellcheck="false"></label></div>
    <canvas id="map-preview" width="160" height="160" aria-label="Map preview"></canvas>

    <h2>Game</h2>
    <div class="grid2">
      <label>Token on turn 1
        <select id="start-token"><option>1</option><option>2</option><option>3</option><option>4</option></select>
      </label>
      <label>Turns <input id="max-turns" type="number" min="1" max="500" value="80"></label>
    </div>

    <details>
      <summary>Timing</summary>
      <label class="check"><input id="t-enforce" type="checkbox" checked> Late answers play STAY, as on the server</label>
      <div class="grid2">
        <label>Turn limit (ms) <input id="t-turn" type="number" min="1" value="200"></label>
        <label>First turn (ms) <input id="t-first" type="number" min="1" value="2000"></label>
        <label>Kill a hung bot after (s) <input id="t-hard" type="number" min="1" step="0.5" value="10"></label>
      </div>
    </details>
    <details>
      <summary>Rule readings</summary>
      <p class="hint">The rulebook leaves these open. Defaults match engine.py on main.</p>
      <div id="rules"></div>
    </details>

    <button id="run" class="primary">Run game</button>
    <div id="run-msg" class="msg" role="status"></div>
  </aside>

  <section id="stage">
    <div id="banner" class="banner" hidden></div>
    <div id="board-wrap">
      <canvas id="board" aria-label="Game board"></canvas>
      <div id="tooltip" class="tooltip" hidden></div>
    </div>
    <div class="transport">
      <button id="first" class="icon" title="Start (Home)">&#x23EE;</button>
      <button id="prev" class="icon" title="Step back (Left arrow)">&#x23F4;</button>
      <button id="play" class="icon play" title="Play or pause (Space)">&#x23F5;</button>
      <button id="next" class="icon" title="Step forward (Right arrow)">&#x23F5;&#x23F5;</button>
      <button id="last" class="icon" title="End (End)">&#x23ED;</button>
      <div class="turn-label"><strong id="turn-label">No game</strong><span id="phase-label"></span></div>
      <label class="inline">Speed
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select>
      </label>
      <label class="check inline" title="Show each turn twice: what the bots chose, then how it resolved"><input id="two-phase" type="checkbox"> Decisions first</label>
      <label class="check inline" id="follow-wrap" hidden><input id="follow" type="checkbox" checked> Follow live</label>
    </div>
    <div class="timeline">
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Turn">
      <canvas id="marks" height="18" aria-hidden="true"></canvas>
    </div>
  </section>

  <aside id="seats" class="panel"></aside>

  <section id="bottom">
    <div class="panel chart-panel">
      <div class="panel-head"><h2>Score</h2>
        <div class="seg small" id="chart-kind"><button data-kind="score" class="on">Total</button><button data-kind="gain">Per turn</button></div>
      </div>
      <canvas id="chart" aria-label="Score chart"></canvas>
    </div>
    <div class="panel">
      <div class="panel-head"><h2 id="log-title">Turn log</h2></div>
      <ol id="log" class="log"></ol>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Bot I/O</h2><div class="seg small" id="io-seat"></div></div>
      <div id="io" class="io"></div>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
